name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"   # Runs automatically every midnight
  workflow_dispatch: {}    # Allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Step 1: Generate Snake Animation
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: lakshay-kumar-1902
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Generate 3D Isometric Profile
      - name: Generate 3D Activity Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lakshay-kumar-1902

      # Step 3: Push both animations to the output branch
      - name: Push outputs to branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
